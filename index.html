<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dav's Stock</title>
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Dav's Stock</div>
    <nav>
      <button class="nav-item active" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="history">History</button>
      <button class="nav-item" data-view="favorites">Favorites</button>
      <button class="nav-item" data-view="portfolio">Portfolio</button>
    </nav>
  </aside>

  <main class="content">
    <!-- DASHBOARD VIEW -->
    <section id="view-dashboard" class="view">
      <header class="page-head">
        <h1>Dashboard</h1>
        <div class="today" id="today">—</div>
        <div class="asof" id="asof">—</div>
      </header>

      <div class="section-block">
        <div class="tier-row">
          <h2 class="tier-title mega">Mega <span class="tier-sub">≥ $200B</span></h2>
          <div class="filters dash-filters">
            <button class="chip active" data-f="both">Both</button>
            <button class="chip" data-f="g200">+200%</button>
            <button class="chip" data-f="y100">+100%</button>
          </div>
        </div>
        <div class="table-wrap"><table id="mega-table" class="grid"></table></div>
      </div>

      <div class="section-block">
        <div class="tier-row">
          <h2 class="tier-title large">Large <span class="tier-sub">$10B – $200B</span></h2>
          <div class="filters dash-filters">
            <button class="chip active" data-f="both">Both</button>
            <button class="chip" data-f="g200">+200%</button>
            <button class="chip" data-f="y100">+100%</button>
          </div>
        </div>
        <div class="table-wrap"><table id="large-table" class="grid"></table></div>
      </div>
    </section>

    <!-- HISTORY VIEW -->
    <section id="view-history" class="view hidden">
      <header class="page-head">
        <h1>Signal History</h1>
        <div class="filters">
          <div class="chip-group" id="hist-tier">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="mega">Mega</button>
            <button class="chip" data-filter="large">Large</button>
          </div>
          <span class="filter-sep"></span>
          <div class="chip-group" id="hist-band">
            <button class="chip active" data-f="both">Both</button>
            <button class="chip" data-f="g200">+200%</button>
            <button class="chip" data-f="y100">+100%</button>
          </div>
          <span class="filter-sep"></span>
          <div class="chip-group" id="hist-range">
            <button class="chip" data-days="30">1M</button>
            <button class="chip active" data-days="90">3M</button>
            <button class="chip" data-days="180">6M</button>
            <button class="chip" data-days="365">1Y</button>
            <button class="chip" data-days="0">All</button>
          </div>
          <span class="count" id="hist-count"></span>
        </div>
      </header>
      <div class="pager" id="hist-pager-top"></div>
      <div class="table-wrap"><table id="hist-table" class="grid"></table></div>
      <div class="pager" id="hist-pager-bot"></div>
    </section>

    <!-- FAVORITES VIEW -->
    <section id="view-favorites" class="view hidden">
      <header class="page-head">
        <h1>Favorites</h1>
      </header>

      <div class="filters" id="fav-filters">
        <div class="chip-group">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="mega">Mega</button>
          <button class="chip" data-filter="large">Large</button>
        </div>
      </div>

      <div class="section-block">
        <h2 class="tier-title star">Star <span class="count" id="star-count"></span></h2>
        <div class="table-wrap"><table id="star-table" class="grid"></table></div>
      </div>

      <div class="section-block">
        <h2 class="tier-title fav">Favorites <span class="count" id="fav-count"></span></h2>
        <div class="table-wrap"><table id="fav-table" class="grid"></table></div>
      </div>
    </section>

    <!-- PORTFOLIO VIEW -->
    <section id="view-portfolio" class="view hidden">
      <header class="page-head"><h1>Portfolio</h1></header>

      <div class="port-stats" id="port-stats"></div>

      <div class="table-wrap"><table id="port-table" class="grid"></table></div>

      <div class="port-add">
        <input type="date" id="pa-date">
        <input id="pa-ticker" placeholder="Ticker" autocomplete="off" spellcheck="false">
        <input id="pa-cost" type="number" step="any" placeholder="Cost / share">
        <input id="pa-shares" type="number" step="any" placeholder="# Shares">
        <button id="pa-add" class="sync-btn">Add</button>
      </div>

      <div class="port-charts">
        <div class="chart-box"><h3>Original vs Now</h3><div id="chart-overall"></div></div>
        <div class="chart-box"><h3>Portfolio</h3><div class="chart-scroll"><div id="chart-perstock"></div></div></div>
        <div class="chart-box chart-wide"><h3>Worth over time</h3><div id="chart-worth"></div></div>
      </div>

      <div class="section-block">
        <h2 class="tier-title fav">Closed <span class="count" id="closed-count"></span></h2>
        <div class="table-wrap"><table id="closed-table" class="grid"></table></div>
      </div>
    </section>
  </main>
</div>

<div id="sell-modal" class="modal hidden">
  <div class="modal-backdrop" data-sclose></div>
  <div class="modal-box">
    <div class="modal-head"><span id="sell-title"></span><button class="modal-x" data-sclose aria-label="close">✕</button></div>
    <div class="modal-body sell-body">
      <label class="sell-field">Sell price / share<input id="sell-price" type="number" step="any"></label>
      <label class="sell-field">Sell date<input id="sell-date" type="date"></label>
      <div class="sell-actions"><button class="sync-btn" data-sclose>Cancel</button><button class="sync-btn primary" id="sell-confirm">Confirm sell</button></div>
    </div>
  </div>
</div>

<div id="signal-modal" class="modal hidden">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box">
    <div class="modal-head"><span id="sm-title"></span><button class="modal-x" data-close aria-label="close">✕</button></div>
    <div id="sm-body" class="modal-body"></div>
  </div>
</div>

<script src="app.js?v=20"></script>
</body>
</html>
