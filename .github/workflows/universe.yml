name: weekly-universe

# Rechecks the NASDAQ >$10B universe once a week (mega/large tiers), then runs
# the daily refresh so any newly-added names are pulled the same day.
#
# 13:00 UTC Sunday == ~8-9am ET Sunday (markets closed; quiet time).
on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Recheck universe
        run: python scripts/refresh_universe.py
      - name: Refresh daily data for the new universe
        run: python scripts/refresh_daily.py
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "weekly universe + data $(date -u +%Y-%m-%d)"
          git push
