name: daily-refresh

# Pulls the latest Yahoo data after each weekday US close, recomputes signals,
# and commits the refreshed data/ files. GitHub Pages then redeploys on its own.
#
# Cron is in UTC. 01:00 UTC Tue-Sat  ==  ~8pm ET (EST) / 9pm ET (EDT) Mon-Fri,
# i.e. a few hours after the 4pm ET close, once the daily volume has settled.
on:
  schedule:
    - cron: '0 1 * * 2-6'
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write         # so the job can commit the refreshed data back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Refresh daily data
        run: python scripts/refresh_daily.py
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "daily data $(date -u +%Y-%m-%d)"
          git push
